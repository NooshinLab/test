function doc(S){const s=S.site,j=x=>JSON.stringify(x).replace(/</g,'\\u003c'),ld={'@context':'https://schema.org','@type':'ItemList',itemListElement:S.products.map((p,i)=>({'@type':'ListItem',position:i+1,item:{'@type':'Product',name:p.name,description:p.desc,image:p.img||undefined,offers:{'@type':'Offer',priceCurrency:'IRR',price:String((p.price||0)*10),availability:'https://schema.org/'+(p.stock?'InStock':'OutOfStock')}}}))};
return '<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+E(s.seoTitle)+'</title><meta name="description" content="'+E(s.seoDesc)+'"><meta name="keywords" content="'+E(s.seoKeys)+'"><meta property="og:title" content="'+E(s.seoTitle)+'"><meta property="og:description" content="'+E(s.seoDesc)+'"><meta property="og:locale" content="fa_IR"><meta property="og:type" content="website"><meta property="og:site_name" content="'+E(s.name)+'"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="theme-color" content="#0f1a14"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="'+E(s.seoTitle)+'"><meta name="twitter:description" content="'+E(s.seoDesc)+'"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet"><style id="css">'+$('#css').textContent.replace(/--ac:#[0-9a-f]{3,8}/i,'--ac:'+s.accent)+'</style><script type="application/ld+json">'+j([ld,{'@context':'https://schema.org','@type':'Store',name:s.name,description:s.seoDesc,telephone:s.phone,address:{'@type':'PostalAddress',streetAddress:s.address,addressCountry:'IR'},sameAs:[s.channelUrl]},{'@context':'https://schema.org','@type':'FAQPage',mainEntity:(S.faq||[]).map(f=>({'@type':'Question',name:f.q,acceptedAnswer:{'@type':'Answer',text:f.a}}))}])+'</'+'script></head><body><div id="root">'+view(S)+'</div><div id="panel"></div><div id="modal"></div><script id="state" type="application/json">'+j(S)+'</'+'script><script id="code">'+$('#code').textContent+'</'+'script></body></html>'}
function fx(){document.documentElement.classList.add('js');const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});document.querySelectorAll('.rv').forEach(e=>io.observe(e))}
$('#root').innerHTML=view(S);document.documentElement.style.setProperty('--ac',S.site.accent);fx();
$('#root').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){document.querySelectorAll('.fil button').forEach(x=>x.classList.toggle('on',x==b));$('#grid').innerHTML=grid(S,b.dataset.f);fx()}if(e.target.id=='adm')openP();if(e.target.closest('#mn'))openM();const o=e.target.closest('[data-o]');if(o)openO(o.dataset.o)});
$('#root').addEventListener('mousemove',e=>{const c=e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*8+'deg');c.style.setProperty('--rx',(.5-(e.clientY-r.top)/r.height)*8+'deg')});
$('#root').addEventListener('mouseout',e=>{const c=e.target.closest('.card');c&&(c.style.removeProperty('--rx'),c.style.removeProperty('--ry'))});
(async()=>{try{const u=await claude.use('user');if(u&&u.canEdit&&u.canEdit()){const b=document.createElement('button');b.id='adm';b.className='btn sm ghost';b.textContent='⚙ مدیریت';document.querySelector('.hd').append(b)}}catch(e){}})();
function upd(){const m=$('#modal'),p=S.products.find(x=>x.id==m.dataset.id),s=S.site,q=Math.max(1,+$('#oq').value||1),n=$('#on').value;$('#ot').textContent=p.price?fa(p.price*q)+' تومان':'تماس بگیرید';$('#ow').href=s.whatsapp?'https://wa.me/'+s.whatsapp+'?text='+encodeURIComponent('سلام، می‌خوام '+q+' عدد «'+p.name+'» سفارش بدم.'+(n?'\nنام: '+n:'')):'tel:'+s.phone}
function openO(id){const p=S.products.find(x=>x.id==id),s=S.site,m=$('#modal');if(!p)return;m.dataset.id=id;m.innerHTML=`<div class="mb" role="dialog" aria-modal="true" aria-label="سفارش ${E(p.name)}"><button class="x" data-x aria-label="بستن">✕</button><img src="${E(img(p))}" alt="${E(p.name)}"><h3>${E(p.name)}</h3><p>${E(p.desc)}</p><label>نام شما<input id="on" placeholder="اختیاری"></label><label>تعداد<input id="oq" type="number" min="1" value="1"></label><div class="tot">جمع: <b id="ot"></b></div><div class="row"><a class="btn" id="ow" target="_blank" rel="noopener">ثبت سفارش در واتساپ</a><a class="btn ghost" href="tel:${E(s.phone)}">تماس تلفنی</a></div></div>`;m.classList.add('open');upd()}
$('#modal').addEventListener('input',upd);$('#modal').addEventListener('click',e=>{if(e.target.id=='modal'||e.target.dataset.x!=null)e.currentTarget.classList.remove('open')});addEventListener('keydown',e=>e.key=='Escape'&&$('#modal').classList.remove('open'));
function openM(){const s=S.site,m=$('#modal');m.dataset.id='';m.innerHTML=`<div class="mb mn" role="dialog" aria-modal="true" aria-label="منو"><button class="x" data-x aria-label="بستن">✕</button><h3>🍄 ${E(s.name)}</h3>${S.menu.map(x=>`<a class="mi" href="${E(x.h)}" data-x>${E(x.t)}</a>`).join('')}<a class="btn" href="tel:${E(s.phone)}">📞 ${E(s.phone)}</a>${s.whatsapp?`<a class="btn ghost" href="https://wa.me/${E(s.whatsapp)}" target="_blank" rel="noopener">💬 واتساپ</a>`:''}<a class="btn ghost" href="${E(s.channelUrl)}" target="_blank" rel="noopener">📣 ${E(s.channelName)}</a></div>`;m.classList.add('open')}
/* ---- admin ---- */
const F=(k,l,v,o={})=>o.area?`<label>${l}<textarea data-k="${k}">${E(v)}</textarea></label>`:`<label>${l}<input data-k="${k}" ${o.n?'data-n="1" inputmode="numeric"':''} ${o.c?'type="color"':''} value="${E(v)}"></label>`;
const SF=[['name','نام فروشگاه (هدر)'],['phone','شماره تماس'],['whatsapp','شماره واتساپ با کد کشور (مثال 98912...)'],['channelName','نام کانال'],['channelUrl','لینک کانال (تلگرام / ایتا / اینستاگرام)'],['address','آدرس'],['heroTitle','تیتر صفحه اصلی'],['heroSub','توضیح صفحه اصلی',1],['heroBtn','متن دکمه'],['aboutTitle','عنوان درباره ما'],['aboutText','متن درباره ما',1],['footerText','متن فوتر',1],['copyright','کپی‌رایت فوتر'],['accent','رنگ اصلی سایت',0,1],['seoTitle','عنوان سئو (Title)'],['seoDesc','توضیحات سئو (Description)',1],['seoKeys','کلمات کلیدی (با کاما)',1]];
function panel(){const t=P.tab;let h=`<div class="ph"><b>پنل مدیریت</b><div class="row"><button class="btn sm" data-a="save">ذخیره و انتشار</button><button class="btn sm ghost" data-a="close">✕</button></div></div><div class="tabs">${[['p','محصولات'],['s','تنظیمات سایت'],['m','منو و دسته‌ها']].map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${t==k?'on':''}">${l}</button>`).join('')}</div><div class="pb">`;
if(t=='p')h+='<button class="btn sm" data-a="addp">+ محصول جدید</button>'+D.products.map((p,i)=>`<div class="pr"><img src="${E(img(p))}" alt=""><div class="g">${F(`products.${i}.name`,'نام محصول',p.name)}${F(`products.${i}.price`,'قیمت (تومان) — خالی = تماس بگیرید',p.price||'',{n:1})}<label>دسته<select data-k="products.${i}.cat">${D.cats.map(c=>`<option value="${E(c.id)}"${c.id==p.cat?' selected':''}>${E(c.name)}</option>`).join('')}</select></label>${F(`products.${i}.img`,'لینک عکس',p.img)}<label>آپلود عکس<input type="file" accept="image/*" data-up="${i}"></label>${F(`products.${i}.desc`,'توضیحات',p.desc,{area:1})}<label class="ck"><input type="checkbox" data-k="products.${i}.stock"${p.stock?' checked':''}> موجود است</label><button class="btn sm ghost" data-a="delp" data-v="${i}">حذف محصول</button></div></div>`).join('');
if(t=='s')h+=SF.map(([k,l,a,c])=>F('site.'+k,l,D.site[k],{area:a,c})).join('');
if(t=='m')h+='<b>منوی هدر و فوتر</b>'+D.menu.map((m,i)=>`<div class="row">${F(`menu.${i}.t`,'عنوان',m.t)}${F(`menu.${i}.h`,'لینک',m.h)}<button class="btn sm ghost" data-a="delm" data-v="${i}">✕</button></div>`).join('')+'<button class="btn sm" data-a="addm">+ آیتم منو</button><b>دسته‌بندی‌ها</b>'+D.cats.map((c,i)=>`<div class="row">${F(`cats.${i}.name`,'نام دسته',c.name)}<button class="btn sm ghost" data-a="delc" data-v="${i}">✕</button></div>`).join('')+'<button class="btn sm" data-a="addc">+ دسته جدید</button><b>سوالات متداول (برای سئو)</b>'+(D.faq=D.faq||[]).map((f,i)=>`<div class="g">${F(`faq.${i}.q`,'سوال',f.q)}${F(`faq.${i}.a`,'جواب',f.a,{area:1})}<button class="btn sm ghost" data-a="delq" data-v="${i}">حذف</button></div>`).join('')+'<button class="btn sm" data-a="addq">+ سوال جدید</button>';
const el=$('#panel'),y=el.scrollTop;el.innerHTML=h+'</div>';el.scrollTop=y}
function openP(){D=structuredClone(S);panel();$('#panel').classList.add('open')}
const sp=(o,p,v)=>{const k=p.split('.');let t=o;for(let i=0;i<k.length-1;i++)t=t[k[i]];t[k[k.length-1]]=v};
$('#panel').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;let v=e.target.type=='checkbox'?e.target.checked:e.target.value;if(e.target.dataset.n)v=+v.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g,'')||0;sp(D,k,v)});
$('#panel').addEventListener('change',async e=>{if(e.target.dataset.up==null)return;const f=e.target.files[0];if(!f)return;try{const a=await claude.use('assets');if(!a)return alert('آپلود در دسترس نیست؛ لینک عکس را وارد کنید');const r=await a.upload(f);D.products[e.target.dataset.up].img=r.url;panel()}catch(x){alert('خطا در آپلود: '+(x.code||x.message))}});
$('#panel').addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=+b.dataset.v;
if(a=='close')$('#panel').classList.remove('open');else if(a=='tab'){P.tab=b.dataset.v;panel()}
else{if(a=='addp')D.products.unshift({id:'p'+Date.now(),cat:D.cats[0]?.id||'',name:'محصول جدید',price:0,img:'',color:'#d8c9a8',stock:true,desc:''});
if(a=='delp'&&confirm('حذف شود؟'))D.products.splice(v,1);if(a=='addm')D.menu.push({t:'آیتم جدید',h:'#'});if(a=='delm')D.menu.splice(v,1);if(a=='addc')D.cats.push({id:'c'+Date.now(),name:'دسته جدید'});if(a=='delc')D.cats.splice(v,1);if(a=='addq')D.faq.push({q:'سوال جدید',a:''});if(a=='delq')D.faq.splice(v,1);
if(a=='save'){try{const ar=await claude.use('artifact');await ar.publish(doc(D))}catch(x){alert('خطا در ذخیره: '+(x.code||x.message))}return}panel()}});
</script></body></html>
