 شرایط ساده‌تری نیاز دارد و برای مبتدی‌ها گزینه مناسبی است. موفقیت در پرورش به سه چیز بستگی دارد: بذر سالم، بستر مناسب و کنترل دما و رطوبت.\n\n## ۱. انتخاب بذر و بستر\n\nبذر (اسپان) تازه و بدون آلودگی تهیه کنید. بستر معمولاً از کاه یا ضایعات کشاورزی پاستوریزه‌شده است. بستر آلوده مهم‌ترین دلیل شکست در پرورش خانگی است.\n\n## ۲. تلقیح\n\nبذر را با دست‌های تمیز لابه‌لای بستر مخلوط کنید و کیسه را ببندید. در این مرحله میسلیوم شروع به رشد می‌کند و فقط به محیط تاریک و نسبتاً گرم نیاز دارد.\n\n## ۳. میوه‌دهی\n\nوقتی بستر کاملاً از میسلیوم سفید پوشیده شد، کیسه را در محیط با هوای تازه، نور غیرمستقیم و رطوبت بالا قرار دهید و چند بار در روز اسپری کنید.\n\n- از نور مستقیم خورشید دوری کنید.\n- تهویه را فراموش نکنید.\n- قارچ را پیش از باز شدن کامل کلاهک برداشت کنید.\n\nاین مقاله نمونه است. متن، تصویر و عنوان را از پنل مدیریت تغییر دهید."},{"id":"a2","title":"تفاوت قارچ دکمه‌ای و قارچ صدفی؛ کدام را انتخاب کنیم؟","cat":"راهنمای خرید","date":"۱۴۰۵/۰۸/۰۵","img":"","excerpt":"رنگ، طعم، بستر کشت و دمای مناسب پرورش؛ مقایسه دو قارچ پرطرفدار برای انتخاب بهتر.","body":"قارچ دکمه‌ای و قارچ صدفی هر دو خوراکی و پرمصرف هستند، اما شرایط پرورش و بستر کشت آن‌ها فرق دارد.\n\n## قارچ دکمه‌ای\n\nروی کمپوست رشد می‌کند و به کنترل دقیق‌تر دما و رطوبت نیاز دارد. طعم ملایم و کلاهک گرد دارد و در غذاهای مختلف مصرف می‌شود.\n\n## قارچ صدفی\n\nروی کاه و ضایعات کشاورزی رشد می‌کند، سریع‌تر محصول می‌دهد و برای شروع مناسب‌تر است. انواع سفید، آبی، صورتی، طلایی و قهوه‌ای در رنگ، طعم و دمای مناسب پرورش تفاوت دارند.\n\n## کدام را انتخاب کنم؟\n\n- برای شروع و تجربه اول: قارچ صدفی\n- برای تولید در محیط کنترل‌شده: قارچ دکمه‌ای\n\nاین مقاله نمونه است و از پنل مدیریت قابل ویرایش است."},{"id":"a3","title":"نگهداری درست بذر قارچ و کمپوست","cat":"آموزش","date":"۱۴۰۵/۰۷/۲۸","img":"","excerpt":"بذر و کمپوست زنده‌اند و به نگهداری درست نیاز دارند. چند نکته ساده برای جلوگیری از هدر رفتن آن‌ها.","body":"بذر قارچ و کمپوست هر دو محصول زنده هستند و نگهداری نامناسب باعث کاهش کیفیت یا آلودگی می‌شود.\n\n## بذر قارچ\n\nبذر را در محل خنک و {id:'a1',title:'راهنمای شروع پرورش قارچ صدفی در خانه',cat:'آموزش',date:'۱۴۰۵/۰۸/۱۰',img:'',excerpt:'اگر تازه‌کار هستید، قارچ صدفی ساده‌ترین انتخاب برای شروع است. در این مقاله مراحل اصلی کار را مرور می‌کنیم.',body:'قارچ صدفی نسبت به قارچ دکمه‌ای به شرایط ساده‌تری نیاز دارد و برای مبتدی‌ها گزینه مناسبی است. موفقیت در پرورش به سه چیز بستگی دارد: بذر سالم، بستر مناسب و کنترل دما و رطوبت.\n\n## ۱. انتخاب بذر و بستر\n\nبذر (اسپان) تازه و بدون آلودگی تهیه کنید. بستر معمولاً از کاه یا ضایعات کشاورزی پاستوریزه‌شده است. بستر آلوده مهم‌ترین دلیل شکست در پرورش خانگی است.\n\n## ۲. تلقیح\n\nبذر را با دست‌های تمیز لابه‌لای بستر مخلوط کنید و کیسه را ببندید. در این مرحله میسلیوم شروع به رشد می‌کند و فقط به محیط تاریک و نسبتاً گرم نیاز دارد.\n\n## ۳. میوه‌دهی\n\nوقتی بستر کاملاً از میسلیوم سفید پوشیده شد، کیسه را در محیط با هوای تازه، نور غیرمستقیم و رطوبت بالا قرار دهید و چند بار در روز اسپری کنید.\n\n- از نور مستقیم خورشید دوری کنید.\n- تهویه را فراموش نکنید.\n- قارچ را پیش از باز شدن کامل کلاهک برداشت کنید.\n\nاین مقاله نمونه است. متن، تصویر و عنوان را از پنل مدیریت تغییر دهید.'},
{id:'a2',title:'تفاوت قارچ دکمه‌ای و قارچ صدفی؛ کدام را انتخاب کنیم؟',cat:'راهنمای خرید',date:'۱۴۰۵/۰۸/۰۵',img:'',excerpt:'رنگ، طعم، بستر کشت و دمای مناسب پرورش؛ مقایسه دو قارچ پرطرفدار برای انتخاب بهتر.',body:'قارچ دکمه‌ای و قارچ صدفی هر دو خوراکی و پرمصرف هستند، اما شرایط پرورش و بستر کشت آن‌ها فرق دارد.\n\n## قارچ دکمه‌ای\n\nروی کمپوست رشد می‌کند و به کنترل دقیق‌تر دما و رطوبت نیاز دارد. طعم ملایم و کلاهک گرد دارد و در غذاهای مختلف مصرف می‌شود.\n\n## قارچ صدفی\n\nروی کاه و ضایعات کشاورزی رشد می‌کند، سریع‌تر محصول می‌دهد و برای شروع مناسب‌تر است. انواع سفید، آبی، صورتی، طلایی و قهوه‌ای در رنگ، طعم و دمای مناسب پرورش تفاوت دارند.\n\n## کدام را انتخاب کنم؟\n\n- برای شروع و تجربه اول: قارچ صدفی\n- برای تولید در محیط کنترل‌شده: قارچ دکمه‌ای\n\nاین مقاله نمونه است و از پنل مدیریت قابل ویرایش است.'},
{id:'a3',title:'نگهداری درست بذر قارچ و کمپوست',cat:'آموزش',date:'۱۴۰۵/۰۷/۲۸',img:'',excerpt:'بذر و کمپوست زنده‌اند و به نگهداری درست نیاز دارند. چند نکته ساده برای جلوگیری از هدر رفتن آن‌ها.',body:'بذر قارچ و کمپوست هر دو محصول زنده هستند و نگهداری نامناسب باعث کاهش کیفیت یا آلودگی می‌شود.\n\n## بذر قارچ\n\nبذر را در محل خنک و دور از نور مستقیم نگهداری کنید و در اسرع وقت مصرف کنید. بسته را فقط هنگام استفاده باز کنید.\n\n## کمپوست\n\nکمپوست را دور از رطوبت اضافه و آلودگی نگه دارید. پیش از تلقیح، بستر نباید بوی تند یا کپک‌زدگی داشته باشد.\n\n- دست‌ها و ابزار را ضدعفونی کنید.\n- بسته‌های باز شده را سریع مصرف کنید.\n\nاین مقاله نمونه است و از پنل مدیریت قابل ویرایش است.'}],
faq:[{q:'کمپوست قارچ دکمه‌ای چیست و چطور استفاده می‌شود؟',a:'کمپوست قارچ بستر اصلی رشد قارچ دکمه‌ای است. بعد از تلقیح با بذر قارچ و رعایت دما و رطوبت مناسب، قارچ روی آن رشد می‌کند.'},{q:'تفاوت قارچ صدفی سفید، آبی، صورتی، طلایی و قهوه‌ای چیست؟',a:'همه از خانواده قارچ صدفی هستند و تفاوت اصلی آن‌ها در رنگ، طعم و دمای مناسب پرورش است. قارچ صدفی آبی و قهوه‌ای معمولاً دمای خنک‌تر و صدفی طلایی و صورتی دمای گرم‌تر را ترجیح می‌دهند.'},{q:'برای شروع پرورش قارچ کدام نوع مناسب‌تر است؟',a:'قارچ صدفی برای مبتدی‌ها مناسب‌تر است چون نسبت به قارچ دکمه‌ای به شرایط ساده‌تری نیاز دارد.'},{q:'بذر قارچ را چگونه نگهداری کنم؟',a:'بذر قارچ (اسپان) را در محل خنک و دور از نور مستقیم نگهداری کنید و در اسرع وقت مصرف کنید.'},{q:'آیا قارچ خوراکی تازه ارسال می‌شود؟',a:'بله، قارچ خوراکی تازه با بسته‌بندی مناسب ارسال می‌شود. برای هماهنگی با شماره تماس سایت در ارتباط باشید.'},{q:'چطور سفارش بدهم؟',a:'محصول را به سبد خرید اضافه کنید، مشخصات را وارد کنید و سفارش را در واتساپ برای ما بفرستید.'}]}}

const mix=(a,b,k)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),x=p(a),y=p(b);return '#'+x.map((v,i)=>Math.round(v*(1-k)+y[i]*k).toString(16).padStart(2,'0')).join('')};
const lum=h=>{const c=[1,3,5].map(i=>{const v=parseInt(h.slice(i,i+2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const onc=h=>lum(h)>.4?'#10170f':'#ffffff';
function themeCss(t){t=t||{};const pre=PRE[t.preset]||PRE.forest;let L=pre[1],K=pre[2];const cu=/^#[0-9a-f]{6}$/i.test(t.custom||'');if(cu){L=t.custom;K=mix(t.custom,'#ffffff',.42)}if(!cu&&(!t.preset||t.preset=='forest'))return '';
const lt=`--pr:${L};--prt:${onc(L)};--pr2:${mix('#ffffff',L,.12)};--bg:${mix('#f7f8f7',L,.05)};--sf2:${mix('#ffffff',L,.08)};--ln:${mix('#e3e7e4',L,.1)};--tx:${mix('#121a15',L,.12)};--mu:${mix('#5d6962',L,.15)};`,dk=`--pr:${K};--prt:${onc(K)};--pr2:${mix('#121613',K,.2)};--bg:${mix('#0c0f0d',K,.08)};--sf:${mix('#121613',K,.1)};--sf2:${mix('#181e1a',K,.13)};--ln:${mix('#242c27',K,.15)};--tx:${mix('#eef2ef',K,.06)};--mu:${mix('#9aa69e',K,.12)};color-scheme:dark;`;
return `:root{${lt}}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){${dk}}}:root[data-theme="dark"]{${dk}}`}
function applyTheme(t){let e=document.getElementById('tcss');if(!e){e=document.createElement('style');e.id='tcss';document.head.append(e)}e.textContent=themeCss(t);setMo(t)}

function after(){const m=$('#main');m.style.animation='none';m.offsetWidth;m.style.animation='';if(io)io.disconnect();if(!document.documentElement.classList.contains('mo')||!window.IntersectionObserver)return;
io=new IntersectionObserver(es=>{const q=[];es.forEach(x=>{if(x.isIntersecting){q.push(x.target);io.unobserve(x.target)}});q.forEach((el,i)=>setTimeout(()=>el.classList.add('in'),i*70))},{threshold:.08});

function fly(from){const to=document.querySelector('.cb');if(!document.documentElement.classList.contains('mo')||!from.animate||!to)return;const a=from.getBoundingClientRect(),b=to.getBoundingClientRect(),d=document.createElement('i');d.style.cssText=`position:fixed;z-index:80;left:${a.left+a.width/2-9}px;top:${a.top+a.height/2-9}px;width:18px;height:18px;border-radius:50%;background:var(--pr);pointer-events:none`;document.body.append(d);d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${b.left+b.width/2-a.left-a.width/2}px,${b.top+b.height/2-a.top-a.height/2}px) scale(.3)`,opacity:.5}],{duration:650,easing:'cubic-bezier(.5,-.2,.7,1)'}).onfinish=()=>{d.remove();bump()}}
